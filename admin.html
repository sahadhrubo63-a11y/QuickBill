<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - POS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen font-['Inter']">

    <!-- ADMIN LOGIN -->
    <div id="admin-login-wrapper" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border">
            <div class="text-center mb-6">
                <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold uppercase">Restricted</span>
                <h2 class="text-3xl font-bold mt-2">Admin Panel Login</h2>
            </div>
            <form onsubmit="event.preventDefault(); AdminPanel.login();" class="space-y-4">
                <input type="text" id="admin-user" required class="w-full border p-3 rounded-lg text-sm" placeholder="Username (admin)">
                <input type="password" id="admin-pass" required class="w-full border p-3 rounded-lg text-sm" placeholder="Password (admin123)">
                <button type="submit" class="w-full bg-amber-600 text-white p-3 rounded-lg font-semibold hover:bg-amber-700">Login</button>
            </form>
            <div class="text-center mt-4"><a href="index.html" class="text-xs text-indigo-600 hover:underline">← Back to Software</a></div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="admin-dashboard-wrapper" class="hidden flex-grow p-6 md:p-8 max-w-7xl mx-auto w-full space-y-6">
        <div class="flex justify-between items-center border-b pb-4 bg-white p-6 rounded-2xl shadow-sm">
            <div>
                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Administrator Dashboard</span>
                <h1 class="text-2xl font-bold mt-1">User Verification & Management Center</h1>
            </div>
            <button onclick="AdminPanel.logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Logout</button>
        </div>

        <div class="flex space-x-2 border-b pb-2">
            <button onclick="AdminPanel.switchTab('pending')" id="admin-btn-pending" class="px-4 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white">Pending Requests (<span id="count-pending">0</span>)</button>
            <button onclick="AdminPanel.switchTab('approved')" id="admin-btn-approved" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-600">Approved Users (<span id="count-approved">0</span>)</button>
            <button onclick="AdminPanel.switchTab('rejected')" id="admin-btn-rejected" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-slate-600">Rejected List (<span id="count-rejected">0</span>)</button>
        </div>

        <!-- PENDING TAB -->
        <div id="admin-tab-pending" class="admin-tab-content space-y-4">
            <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 uppercase text-xs"><tr><th class="p-4">Applicant / Shop</th><th class="p-4">Contact</th><th class="p-4">DOB & Age</th><th class="p-4 text-center">Action</th></tr></thead>
                    <tbody id="table-pending-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <!-- APPROVED TAB -->
        <div id="admin-tab-approved" class="admin-tab-content hidden space-y-4">
            <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 uppercase text-xs"><tr><th class="p-4">User & Shop</th><th class="p-4">Username</th><th class="p-4">Views</th><th class="p-4">Status / Delist Toggle</th></tr></thead>
                    <tbody id="table-approved-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <!-- REJECTED TAB -->
        <div id="admin-tab-rejected" class="admin-tab-content hidden space-y-4">
            <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 uppercase text-xs"><tr><th class="p-4">Applicant</th><th class="p-4">Contact</th><th class="p-4 text-center">Permanently Remove</th></tr></thead>
                    <tbody id="table-rejected-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FULLSCREEN PROFILE MODAL -->
    <div id="fullscreen-profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 transition-all duration-300 opacity-0 scale-95">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="AdminPanel.closeFullscreenProfile()" class="absolute top-6 right-6 bg-slate-100 w-10 h-10 rounded-full font-bold">✕</button>
            <div id="profile-modal-content" class="space-y-4"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
